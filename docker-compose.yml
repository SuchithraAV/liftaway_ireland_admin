version: "3.8"

services:
  admin-backend:
    build: .
    image: breakdown-admin-backend:latest
    container_name: admin-backend

    ports:
      - "8002:8002"

    # Load ALL environment variables from .env file
    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
